# --- ntfy notifications, added 2026-08-04 -----------------------------------
# Publishes to PUBLIC ntfy.sh on a random unguessable topic. Chosen 2026-08-04
# because the iOS ntfy app rejects knave's mkcert certificate: the leaf is valid
# 822 days, past Apple's 398-day cap. TLS was the blocker, not the app.
#
# Tradeoff accepted knowingly: print events - filenames, success, failure -
# leave the network and land on a third-party server, and anyone who learns the
# topic can read them. The topic is kept OUT of git; it lives in .ntfy-topic
# next to this file, chmod 600, and in these lines on knave only.
#
# The self-hosted path still exists: moonraker stays attached to
# odysseus_default in docker-compose.yml, so ntfy://ntfy/solder works again the
# moment a valid certificate is in place - Tailscale, or a 397-day leaf.

[notifier print_complete]
url: ntfy://ntfy.sh/<REDACTED - see .ntfy-topic on knave>
title: Solder - print finished
body: {event_args[1].filename} done
events: complete

[notifier print_error]
url: ntfy://ntfy.sh/<REDACTED - see .ntfy-topic on knave>
title: Solder - PRINT FAILED
body: {event_args[1].filename} errored. If mains dropped, run PLR_STATUS then RESUME_AFTER_POWER_LOSS.
events: error

[notifier print_cancelled]
url: ntfy://ntfy.sh/<REDACTED - see .ntfy-topic on knave>
title: Solder - print cancelled
body: {event_args[1].filename} cancelled
events: cancelled

[notifier print_paused]
url: ntfy://ntfy.sh/<REDACTED - see .ntfy-topic on knave>
title: Solder - paused
body: {event_args[1].filename} paused. Check the spool for a tangle and the nozzle for a clog before resuming.
events: paused

# --- Spoolman ---------------------------------------------------------------
# Filament and spool tracking. The service is a container in this same compose
# project, so it resolves by service name on the shared default network; there
# is no host IP or published port in this path.
[spoolman]
server: http://spoolman:8000
sync_rate: 5


# Filament tracking. Restarting it does not touch a running print - moonraker
# queues the usage report and replays it once spoolman answers again.
[power restart_spoolman]
type: http
on_url: http://dockerapi:2375/containers/spoolman/restart
off_url: http://dockerapi:2375/containers/spoolman/restart
status_url: http://dockerapi:2375/containers/spoolman/json
request_template:
  {% if command == "status" %}
    {% do http_request.set_method("GET") %}
  {% else %}
    {% do http_request.set_method("POST") %}
    {% do http_request.set_body("") %}
  {% endif %}
  {% do http_request.send() %}
response_template:
  {% if command == "status" %}
    { "on" if http_request.last_response().json()["State"]["Running"] else "off" }
  {% else %}
    on
  {% endif %}
locked_while_printing: True


# Serves the UI you are most likely looking at, so the page goes blank for a
# second and reconnects. Nothing on the printer is affected.
[power restart_fluidd]
type: http
on_url: http://dockerapi:2375/containers/fluidd/restart
off_url: http://dockerapi:2375/containers/fluidd/restart
status_url: http://dockerapi:2375/containers/fluidd/json
request_template:
