
[include mainsail.cfg]
[include plr.cfg]
[include maintenance.cfg]
[include shell_command.cfg]

[stepper_x]
step_pin: PB9
dir_pin: PC2
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA5
position_endstop: 0
position_max: 235
homing_speed: 50

[stepper_y]
step_pin: PB7
dir_pin: PB8
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA6
position_endstop: 0
position_max: 235
homing_speed: 50

[stepper_z]
step_pin: PB5
dir_pin: !PB6
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: ^PA7
#position_endstop: 0
position_max: 200
# Must sit below the SAVE_CONFIG position_endstop or Klipper halts on load.
# TESTZ cannot travel past position_min, so too tight a value here leaves
# Z_ENDSTOP_CALIBRATE unable to reach the bed.
position_min: -5

[extruder]
max_extrude_only_distance: 200.0   # E_CAL_START headroom
# Klipper clamps extrude-only moves to these. Set explicitly rather than
# derived from [printer] max_velocity/max_accel (0.266x each), so floored XY
# limits cannot throttle retraction. 40 clears the slicer's 35 mm/s retract;
# slower strings PETG badly.
max_extrude_only_velocity: 40.0
max_extrude_only_accel: 500.0
step_pin: PB3
dir_pin: PB4
enable_pin: !PC3
microsteps: 16
# Vendor nominal 93 steps/mm (200 * 16 / 93), not a measurement. Re-measure
# with E_CAL_START before trusting any print (machine/calibration.md).
rotation_distance: 34.406
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
# Stock hotend curve. The fitted all-metal hotend may carry an NTC 100K Beta
# 3950 bead instead; the two agree at room temp and diverge 5-10 C by 200 C.
# Verify before trusting PID or any print temp. If 3950: sensor_type: Generic 3950
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
control: pid
# tuned at a 200 C target
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 300
pressure_advance: 0.0   # retune for direct drive, expect 0.02-0.08

[heater_bed]
heater_pin: PA2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130

[fan]
pin: PA0

[mcu]
serial: /dev/printer
#baud: 115200
restart_method: command

[board_pins]
aliases:
  EXP1_1=PC6,EXP1_3=PB10,EXP1_5=PB14,EXP1_7=PB12,EXP1_9=<GND>,
  EXP1_2=PB2,EXP1_4=PB11,EXP1_6=PB13,EXP1_8=PB15,EXP1_10=<5V>,
  PROBE_IN=PB0,PROBE_OUT=PB1,FIL_RUNOUT=PA4

[printer]
kinematics: cartesian
# Travel speed is the largest single lever on PETG stringing here, larger than
# any retraction value: the slicer emits 120 mm/s travels and max_velocity
# clamps them. Still at or below the vendor firmware (accel 500, Z accel 100).
# Nothing here is measured - run TEST_SPEED before a long print and check for
# lost steps.
max_velocity: 150
max_accel: 500
square_corner_velocity: 5.0
max_z_velocity: 5
max_z_accel: 100

[bed_screws]
screw1: 30.5, 37
screw2: 30.5, 207
screw3: 204.5, 207
screw4: 204.5, 37

#[filament_switch_sensor Filament_runout_sensor]
#switch_pin: !PA4 # Pin that the sensor is connected to

[firmware_retraction]
retract_length: 0.6
retract_speed: 20
unretract_extra_length: 0.0
unretract_speed: 10

[save_variables]
filename: /opt/printer_data/config/variables.cfg

[gcode_arcs]
resolution = 1.0

[idle_timeout]
gcode:
    DISABLE_STEPPER
    TURN_OFF_HEATERS
timeout: 600

[include macros.cfg]

[exclude_object]
[force_move]
enable_force_move: True


[input_shaper]
# Direct drive puts the extruder mass on the X carriage, so ringing is worse
# than stock. No accelerometer: print a ringing tower, measure the band
# spacing, then set these and uncomment.
#shaper_type_x: mzv
#shaper_freq_x: 40
#shaper_type_y: mzv
#shaper_freq_y: 40

[bed_mesh]
# No probe mounted: BED_MESH_CALIBRATE METHOD=manual walks the nozzle to each
# point to paper-gauge. mesh_min/mesh_max assume the nozzle still reaches them
# - recheck once the direct-drive nozzle offset is measured.
speed: 80
horizontal_move_z: 5
mesh_min: 30, 30
mesh_max: 200, 200
probe_count: 4, 4
algorithm: bicubic
fade_start: 1.0
fade_end: 10.0

[verify_heater extruder]
# Below the 120 C default: all-metal hotend, this is the thermal-runaway net.
# A false trip here means the PID is wrong, not the limit.
max_error: 90
check_gain_time: 20
hysteresis: 5
heating_gain: 2

[verify_heater heater_bed]
max_error: 130
# 235x235 bed under carborundum glass climbs slowly; the 60 s default trips
# before it gains 2 C.
check_gain_time: 90
hysteresis: 5
heating_gain: 2

[safe_z_home]
# Homes X and Y, parks at bed centre, then homes Z. No probe required - this
# only sets where the nozzle sits when Z comes down. With dual Z, centre is a
# better reference than a corner.
home_xy_position: 117.5, 117.5
speed: 50
z_hop: 10
z_hop_speed: 5

[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

