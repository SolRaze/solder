# ---------------------------------------------------------------------------
# Mainsail/Fluidd client variables. mainsail.cfg is vendor read-only and gets
# replaced on update - this is the supported override point for PAUSE, RESUME
# and CANCEL, rather than editing the vendor macros directly.
#
# Only single-line commands are allowed in the user_*_macro slots.
#
# Ordering inside the vendor macros, if anything ever goes back in these slots:
#   PAUSE  : PAUSE_BASE -> user_pause_macro -> _TOOLHEAD_PARK_PAUSE_CANCEL
#            so a user macro runs from the print position, parking follows.
#   RESUME : user_resume_macro -> RESUME_BASE
#            so a user macro runs from the park, before the toolhead goes back
#            down to the print.
#
# All three slots are empty. CANCEL is deliberately so - a cancel may be an
# emergency stop, and adding travel moves to it is the wrong instinct.
# ---------------------------------------------------------------------------
[gcode_macro _CLIENT_VARIABLE]
# Leading underscore keeps this out of the Fluidd macro list.
variable_use_custom_pos: False
variable_custom_park_dz: 2.0
variable_retract: 1.0
variable_cancel_retract: 5.0
variable_speed_retract: 35.0
variable_unretract: 1.0
variable_speed_unretract: 35.0
variable_speed_hop: 15.0
variable_speed_move: 100.0
variable_park_at_cancel: False
variable_use_fw_retract: False
variable_idle_timeout: 0
variable_runout_sensor: ""
variable_user_pause_macro: ""
variable_user_resume_macro: ""
variable_user_cancel_macro: ""
gcode:

# ===========================================================================
# Print lifecycle
# ===========================================================================

[gcode_macro START_PRINT]
description: Heat, home, prime line. Called by the slicer.
# Bed heats and homes before the nozzle reaches temp, so the direct-drive
# hotend is not oozing across the bed during G28. Prime line E values match the
# line geometry: 0.3 x 0.4 x 180 mm = 21.6 mm3 = ~9 mm of 1.75 mm filament.
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(230)|float %}
    M107                                  ; part fan off
    G90
    SET_GCODE_OFFSET Z=0.0
    PLR_CLEAR                             ; drop stale state from an interrupted print
    M140 S{BED_TEMP}
    M190 S{BED_TEMP}                      ; wait for bed
    M104 S{EXTRUDER_TEMP}                 ; start nozzle, do not wait
    G28                                   ; home while nozzle is still cool
    M109 S{EXTRUDER_TEMP}                 ; now wait for nozzle
    G92 E0
    G1 Z2.0 F3000
    G1 X0.1 Y20 Z0.3 F5000.0              ; start of prime line
    G1 X0.1 Y200.0 Z0.3 F1500.0 E10
    G1 X0.4 Y200.0 Z0.3 F5000.0
    G1 X0.4 Y20 Z0.3 F1500.0 E20
    G92 E0
    G1 E-0.6 F2100                        ; direct-drive retract
    G92 E0
    G1 Z2.0 F3000
    UPDATE_DELAYED_GCODE ID=PLR_TIMER DURATION=30   ; power-loss snapshots

[gcode_macro END_PRINT]
description: Heaters off, present the print, steppers off. Called by the slicer.
variable_machine_depth: 235
gcode:
    M140 S0
    M104 S0
    M106 S0
    G91
    G1 Z0.2 E-2 F2400                     ; retract, lift off the part
    G1 X5 Y5 F3000
    G1 Z10
    G90
    G1 X0 Y{machine_depth}                ; present the print
    M84
    PLR_CLEAR
    MAINT_LOG_PRINT

# ===========================================================================
# Movement
# ===========================================================================

[gcode_macro PARK]
description: Lift 10 mm and park the toolhead clear of the print
gcode:
    SAVE_GCODE_STATE NAME=parking
    M117 Parking toolhead
    G91
    G1 Z10 F600
    G90
    G1 X5 Y225 F4000
    RESTORE_GCODE_STATE NAME=parking

# ===========================================================================
# Preheat and cooldown
#
# PETG 250/80 and PLA 230/60 are what 25 completed prints on this machine used,
# on the stock hotend and against a thermistor curve still unconfirmed - see
# machine/calibration.md.
# ===========================================================================

[gcode_macro PREHEAT_PLA]
description: PLA - bed 60, nozzle 230
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(230)|float %}
    M140 S{BED_TEMP}
    M104 S{EXTRUDER_TEMP}

[gcode_macro PREHEAT_PETG]
description: PETG - bed 80, nozzle 250
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(80)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(250)|float %}
    M140 S{BED_TEMP}
    M104 S{EXTRUDER_TEMP}

[gcode_macro PREHEAT_PETG_HS]
description: Numakers PETG-HS - same as PREHEAT_PETG, named for the spool
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(80)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(250)|float %}
    M140 S{BED_TEMP}
    M104 S{EXTRUDER_TEMP}

[gcode_macro PREHEAT_ABS]
description: ABS - bed 100, nozzle 250. UNTESTED, open frame, no enclosure
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(100)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(250)|float %}
    M140 S{BED_TEMP}
    M104 S{EXTRUDER_TEMP}

[gcode_macro PREHEAT_BED_ONLY]
description: Bed soak without cooking the nozzle
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(80)|float %}
    M140 S{BED_TEMP}

[gcode_macro COOLDOWN]
description: All heaters off, part fan off
gcode:
    TURN_OFF_HEATERS
    M107

# ===========================================================================
# Diagnostics
# ===========================================================================

[gcode_macro TEST_SPEED]
description: Hammer the axes at SPEED/ACCEL and re-home to check for lost steps
# Validates that max_velocity / max_accel actually survive on this frame.
# Homes, runs diagonals and a box at the requested speed, then re-homes -
# if the axes end up somewhere else, steps were lost and the limits are a lie.
# Usage: TEST_SPEED SPEED=200 ACCEL=1000 ITERATIONS=5
gcode:
    {% set speed = params.SPEED|default(printer.configfile.settings.printer.max_velocity)|int %}
    {% set accel = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|int %}
    {% set iterations = params.ITERATIONS|default(5)|int %}
    {% set bound = params.BOUND|default(20)|int %}

    {% set x_min = printer.toolhead.axis_minimum.x + bound %}
    {% set x_max = printer.toolhead.axis_maximum.x - bound %}
    {% set y_min = printer.toolhead.axis_minimum.y + bound %}
    {% set y_max = printer.toolhead.axis_maximum.y - bound %}

    SAVE_GCODE_STATE NAME=TEST_SPEED
    M117 Speed test {speed} mm/s
    G28
    G90
    SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} ACCEL_TO_DECEL={accel / 2}

    {% for i in range(iterations) %}
        G1 X{x_min} Y{y_min} F{speed * 60}
        G1 X{x_max} Y{y_max} F{speed * 60}
        G1 X{x_min} Y{y_min} F{speed * 60}
        G1 X{x_max} Y{y_min} F{speed * 60}
        G1 X{x_min} Y{y_max} F{speed * 60}
        G1 X{x_max} Y{y_min} F{speed * 60}
    {% endfor %}

    SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel}
    G28
    M117 Speed test done - check for lost steps
    RESTORE_GCODE_STATE NAME=TEST_SPEED

# ===========================================================================
# Extruder rotation_distance calibration
#
# Two macros instead of a block of console gcode, because Fluidd's console
# takes one line at a time and because M104 does not wait - pasting the
# obvious sequence extrudes cold and faults on min_extrude_temp.
#
# Usage:
#   1. Mark the filament MARK mm above the extruder inlet. Default 120.
#   2. E_CAL_START TEMP=240
#   3. Wait. It heats, WAITS for temp, then extrudes LENGTH mm at 1 mm/s.
#   4. Measure mark-to-inlet again. That is REMAIN.
#   5. E_CAL_RESULT REMAIN=<measured>
#
# Klipper's formula: new = old * actual / requested
# Under-extrusion gives a SMALLER rotation_distance, which means more steps
# per mm, which means more filament. That is the right direction.
# ===========================================================================

[gcode_macro E_CAL_START]
description: Heat, wait, extrude LENGTH mm slowly for rotation_distance calibration
gcode:
    {% set t = params.TEMP|default(240)|float %}
    {% set l = params.LENGTH|default(100)|float %}
    {% set mark = params.MARK|default(120)|float %}
    {% if printer.virtual_sdcard.is_active %}
        { action_raise_error("A print is running - do not calibrate the extruder now") }
    {% endif %}
    {% set maxe = printer.configfile.settings.extruder.max_extrude_only_distance|float %}
    {% if l > maxe %}
        { action_raise_error("LENGTH %.0f exceeds max_extrude_only_distance %.0f - raise it in printer.cfg" | format(l, maxe)) }
    {% endif %}
    {% if mark <= l %}
        { action_raise_error("MARK %.0f must be further up the filament than LENGTH %.0f" | format(mark, l)) }
    {% endif %}
    M118 Mark the filament {mark|round(0)} mm above the extruder inlet BEFORE this finishes heating.
    M109 S{t}
    M83
    G92 E0
    G1 E{l} F60
    M400
    M118 Extruded {l|round(0)} mm requested. Measure mark-to-inlet now, then run: E_CAL_RESULT REMAIN=<your measurement>

[gcode_macro E_CAL_RESULT]
description: Work out the new rotation_distance from your measurement
gcode:
    {% if params.REMAIN is not defined %}
        { action_raise_error("REMAIN is required - measure mark-to-inlet in mm. E_CAL_RESULT REMAIN=18.5") }
    {% endif %}
    {% set remain = params.REMAIN|float %}
    {% set mark = params.MARK|default(120)|float %}
    {% set l = params.LENGTH|default(100)|float %}
    {% set rd = printer.configfile.settings.extruder.rotation_distance|float %}
    {% set actual = mark - remain %}
    {% if actual <= 0 %}
        { action_raise_error("REMAIN %.1f is not less than MARK %.1f - check which number you measured" | format(remain, mark)) }
    {% endif %}
    {% set new = rd * actual / l %}
    {% set err = (actual - l) / l * 100 %}
    M118 requested {l|round(1)} mm, actual {actual|round(1)} mm  ({err|round(1)}% off)
    M118 old rotation_distance {rd|round(3)}  ->  NEW {new|round(3)}
    M118 Put that in [extruder] rotation_distance in printer.cfg, then FIRMWARE_RESTART and repeat until actual is within 1 percent.
