# ---------------------------------------------------------------------------
# Power-loss recovery
#
# Klipper has no native power-loss recovery. This is the same trick stock
# Marlin used on the Ender 3: snapshot the print position periodically, and on
# restart seek the gcode file back to that byte offset.
#
# It is best-effort. Read machine/power-loss-recovery.md before relying on it.
# The single most important rule is baked into RESUME_AFTER_POWER_LOSS:
# it NEVER homes Z, because homing Z drives the nozzle down into the print.
# ---------------------------------------------------------------------------

[gcode_macro PLR_SAVE]
description: Snapshot print state for power-loss recovery
# Quoting matters: SAVE_VARIABLE runs ast.literal_eval on VALUE, and klipper
# strips ONE layer of surrounding quotes first. A string therefore needs two
# layers - "'like this'". One layer arrives bare and raises ValueError; an empty
# value raises SyntaxError, which save_variables.py does not catch, so it
# surfaces as "Internal error on command: SAVE_VARIABLE" and shuts the printer
# down mid-print. Do not touch this quoting.
gcode:
    {% set fn = printer.print_stats.filename %}
    {% if printer.virtual_sdcard.is_active and fn %}
        SAVE_VARIABLE VARIABLE=plr_file VALUE="'{fn}'"
        SAVE_VARIABLE VARIABLE=plr_pos VALUE={printer.virtual_sdcard.file_position}
        SAVE_VARIABLE VARIABLE=plr_x VALUE={printer.gcode_move.gcode_position.x}
        SAVE_VARIABLE VARIABLE=plr_y VALUE={printer.gcode_move.gcode_position.y}
        SAVE_VARIABLE VARIABLE=plr_z VALUE={printer.gcode_move.gcode_position.z}
        SAVE_VARIABLE VARIABLE=plr_etemp VALUE={printer.extruder.target}
        SAVE_VARIABLE VARIABLE=plr_btemp VALUE={printer.heater_bed.target}
        SAVE_VARIABLE VARIABLE=plr_fan VALUE={(printer.fan.speed * 255)|round|int}
        SAVE_VARIABLE VARIABLE=plr_active VALUE=1
    {% endif %}

[gcode_macro PLR_CLEAR]
description: Forget any saved power-loss state
gcode:
    UPDATE_DELAYED_GCODE ID=PLR_TIMER DURATION=0
    SAVE_VARIABLE VARIABLE=plr_active VALUE=0

[delayed_gcode PLR_TIMER]
# Slicer-independent safety net: saves every 30 s while a print is running.
# Orca also calls PLR_SAVE on every layer change, which is more precise.
initial_duration: 0
gcode:
    PLR_SAVE
    {% if printer.virtual_sdcard.is_active %}
        UPDATE_DELAYED_GCODE ID=PLR_TIMER DURATION=30
    {% endif %}

[gcode_macro PLR_STATUS]
description: Show what would be resumed
gcode:
    {% set v = printer.save_variables.variables %}
    {% if v.plr_active|default(0)|int == 1 %}
        M118 PLR: {v.plr_file} @ byte {v.plr_pos} , Z={v.plr_z} , X={v.plr_x} Y={v.plr_y} , {v.plr_etemp}C / {v.plr_btemp}C
    {% else %}
        M118 PLR: nothing saved
    {% endif %}

[gcode_macro RESUME_AFTER_POWER_LOSS]
description: Best-effort resume after a power cut. Never homes Z. EMODE=RELATIVE|ABSOLUTE
gcode:
    {% set v = printer.save_variables.variables %}
    {% set emode = params.EMODE|default("RELATIVE")|upper %}
    {% if v.plr_active|default(0)|int != 1 %}
        { action_raise_error("No power-loss state saved - nothing to resume") }
    {% endif %}
    {% if not v.plr_file %}
        { action_raise_error("Power-loss state has no filename - cannot resume") }
    {% endif %}
    {% set z = v.plr_z|float %}
    {% set fn = v.plr_file %}
    {% set pos = v.plr_pos|int %}

    M117 PLR resume
    # plr_z is only a claim about where the nozzle is. If Z is already homed,
    # Klipper knows the truth and the claim can only be worse - declaring a
    # stale layer height there silently offsets the whole rest of the print by
    # the difference. Declare it only when Z is unhomed, the real power-cut case.
    {% if 'z' in printer.toolhead.homed_axes %}
        {% set z = printer.gcode_move.gcode_position.z|float %}
        M118 PLR: Z homed at {z}, keeping it, ignoring plr_z {v.plr_z}
    {% else %}
        SET_KINEMATIC_POSITION Z={z}
    {% endif %}
    G91
    G1 Z5 F600
    G90
    # X and Y only. Homing Z here would plough the nozzle through the part.
    G28 X Y

    M140 S{v.plr_btemp}
    M104 S{v.plr_etemp}
    M190 S{v.plr_btemp}
    M109 S{v.plr_etemp}
    M106 S{v.plr_fan}

    # Travel back over the part while still 5 mm clear, then drop.
    G1 X{v.plr_x} Y{v.plr_y} F6000
    G1 Z{z} F600

    {% if emode == "ABSOLUTE" %}
        M82
    {% else %}
        M83
    {% endif %}
    G92 E0

    M23 /{fn}
    M26 S{pos}
    M24

# This file is PLR only. Preheat and cooldown live in macros.cfg.

# ---------------------------------------------------------------------------
# Resuming after an EXTRUSION failure, not a power cut.
#
# plr_pos records where Klipper stopped. If the extruder died first the machine
# carried on moving through air, so that byte describes a part that was never
# printed and the saved point is useless. The real resume point comes from
# measuring the part, and mapping a height to a byte needs a scan of the gcode
# that a Jinja macro cannot do - hence the shell command.
#
# resume-at.py picks the LAST FULL layer, so it prints once more and the nozzle
# lands slightly into solid plastic. Layers are found from ;LAYER_CHANGE where
# the slicer emits it, otherwise from the first extruding move at each new Z,
# which works for any slicer.
# ---------------------------------------------------------------------------

[gcode_shell_command plr_resume_at]
command: /usr/local/bin/python3 /opt/printer_data/config/resume-at.py
timeout: 300.
verbose: True

[gcode_macro PLR_RESUME_AT_Z]
description: Set the PLR resume point from a measured part height. HEIGHT=<mm> [PLR_Z=<mm>]
gcode:
    {% set v = printer.save_variables.variables %}
    {% if printer.virtual_sdcard.is_active %}
        { action_raise_error("A print is running - this would overwrite its resume point") }
    {% endif %}
    {% if not v.plr_file %}
        { action_raise_error("No saved filename - nothing to resume") }
    {% endif %}
    {% if 'HEIGHT' not in params %}
        { action_raise_error("HEIGHT=<measured mm> is required") }
    {% endif %}
    # An unhomed toolhead reports Z 0.0. Defaulting to that writes a lie into
    # plr_z which the resume then believes, so demand a real number.
    {% if 'PLR_Z' not in params and 'z' not in printer.toolhead.homed_axes %}
        { action_raise_error("Z is not homed - home Z, or pass PLR_Z=<physical nozzle mm>") }
    {% endif %}
    # Physical nozzle height, NOT the layer. Homed Z, or park and read it.
    {% set z = params.PLR_Z|default(printer.toolhead.position.z)|float %}
    M118 PLR: mapping {params.HEIGHT} mm in {v.plr_file}, plr_z {z}
    RUN_SHELL_COMMAND CMD=plr_resume_at PARAMS="--apply /opt/printer_data/gcodes/{v.plr_file} {params.HEIGHT} {z}"
