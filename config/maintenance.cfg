# ---------------------------------------------------------------------------
# Maintenance counters
# Counters ride on [save_variables], the same store PLR uses.
# ---------------------------------------------------------------------------

[gcode_macro MAINT_LOG_PRINT]
description: Add this print duration to the running totals. Called by END_PRINT.
gcode:
    {% set v = printer.save_variables.variables %}
    {% set hrs = (printer.print_stats.total_duration|float / 3600.0)|round(3) %}
    {% set n = v.maint_print_count|default(0)|int + 1 %}
    {% set since_bed = n - v.maint_bed_prints_at|default(0)|int %}
    {% if hrs > 0.01 %}
        SAVE_VARIABLE VARIABLE=maint_total_hours VALUE={(v.maint_total_hours|default(0)|float + hrs)|round(3)}
        SAVE_VARIABLE VARIABLE=maint_print_count VALUE={n}
        {% if since_bed >= 3 %}
            M118 Bed screws: {since_bed} prints since the last adjust. Run BED_SCREWS_ADJUST, then MAINT_RESET COMPONENT=bed
        {% endif %}
    {% endif %}

[gcode_macro MAINT_STATUS]
description: Hours since each service item was last reset
gcode:
    {% set v = printer.save_variables.variables %}
    {% set tot = v.maint_total_hours|default(0)|float %}
    M118 Total print hours: {tot|round(1)} over {v.maint_print_count|default(0)|int} prints
    M118 Bed screws:  {v.maint_print_count|default(0)|int - v.maint_bed_prints_at|default(0)|int} prints since adjust  (every 3)
    M118 Nozzle:      {(tot - v.maint_nozzle_at|default(0)|float)|round(1)} h  (change  ~300 h)
    M118 Belts:       {(tot - v.maint_belts_at|default(0)|float)|round(1)} h  (tension ~200 h)
    M118 Lead screws: {(tot - v.maint_screws_at|default(0)|float)|round(1)} h  (grease  ~100 h)
    M118 Wiring:      {(tot - v.maint_wiring_at|default(0)|float)|round(1)} h  (inspect ~150 h)

[gcode_macro MAINT_RESET]
description: MAINT_RESET COMPONENT=bed|nozzle|belts|screws|wiring
gcode:
    {% set c = params.COMPONENT|default("")|lower %}
    {% set tot = printer.save_variables.variables.maint_total_hours|default(0)|float %}
    {% set cnt = printer.save_variables.variables.maint_print_count|default(0)|int %}
    {% if c == "bed" %}
        SAVE_VARIABLE VARIABLE=maint_bed_prints_at VALUE={cnt}
    {% elif c == "nozzle" %}
        SAVE_VARIABLE VARIABLE=maint_nozzle_at VALUE={tot}
    {% elif c == "belts" %}
        SAVE_VARIABLE VARIABLE=maint_belts_at VALUE={tot}
    {% elif c == "screws" %}
        SAVE_VARIABLE VARIABLE=maint_screws_at VALUE={tot}
    {% elif c == "wiring" %}
        SAVE_VARIABLE VARIABLE=maint_wiring_at VALUE={tot}
    {% else %}
        { action_raise_error("COMPONENT must be bed, nozzle, belts, screws or wiring") }
    {% endif %}
    M118 Reset {c} counter at {tot|round(1)} h
